<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Mobile</title>
    <style>
        /* Thêm một chút khoảng cách giữa các nút */
        button {
            margin: 5px;
            padding: 10px 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h2>Chào mừng bạn đến với bài tập Git!</h2>

    <button onclick="sayHello()">Nhấn vào đây</button>

    <button onclick="sayGoodbye()">Tạm biệt</button>
    <script>
        function sayHello() {
            alert("Xin chào!");
        }
        function sayGoodbye() {
            alert("Tạm biệt, hẹn gặp lại!");
        }
    </script>

</body>
</html>
